# GEKIDRIVE Public 完整預設範例；合併到 org.gekidrive.ongeki.public.cfg，保留個人設定。

[Training]
# 練習模式；練習／重放的當局不写入成績與獎勵。
Enabled = false

# CRI DSP 保留音高變速，非數學無損；改速即同步譜面時鐘。
PlaybackSpeed = 1

# 片段起點（秒）。
SegmentStartSeconds = 0

# 片段終點；0 不設終點。
SegmentEndSeconds = 0

# 回到片段前的預備時間。
PreRollSeconds = 2

# 到終點自動重試片段。
LoopSegment = false

# 實體按鍵編號（GameDeviceManager.GKey）；-1 關閉。設置後該鍵仍有原本功能。
CabinetRetryButton = -1

# 目前選中歌曲使用的自製 OGKR 絕對路徑；空白使用原曲。音訊沿用原曲。
CustomChartPath =


[Keys]
# 切換練習模式；本局曾練習即不保存。
ToggleTraining = F9

# 從歌曲開頭重試。
Retry = F10

# 回到片段起點含預備時間。
RewindSegment = Backspace

# 以目前歌曲時間設片段起點。
MarkSegmentStart = Home

# 設片段終點。
MarkSegmentEnd = End

# 重新讀取目前 OGKR 並重試片段。
ReloadChart = F11

# 練習暫停／恢復。
PracticePause = P

# 減速 0.05x。
Slower = Minus

# 加速 0.05x。
Faster = Equals

# 重新讀取 config，重設 OBS／序列埠／顯示設定。
ReloadConfig = F6

# 切換 PlaybackEnabled；載入發生在下一次開始／重試。
ToggleReplayPlayback = F5

# 切換自由鏡頭。
ToggleFreeCamera = F4

# VirtualCredits 開啟時增加一個投幣 pulse。
AddVirtualCoin = Insert


[Visualizer]
# 底部顯示每一擊 Early/Late 毫秒值；漏擊不顯示成時間偏差。
HitTimingBar = true

# 判定條左右各顯示的毫秒範圍。
TimingRangeMs = 100

# 顯示實際拉桿、軌道中心、安全區間及未來 2 秒的中心路徑；中心僅是參考，非唯一解。
LeverTracking = true


[OBS]
# localhost HTTP / WebSocket 伺服器，OBS Browser Source 使用 http://127.0.0.1:port/。
Enabled = false

# HTTP 與 WebSocket 共用埠，綁定 loopback。
Port = 8765


[Replay]
# 自動輸出壓縮 .orp（按鍵、拉桿、判定、彈幕位置與技能事件）。
RecordEverySong = true

# 下一首載入 ReplayPath；歌曲、難度與譜面 SHA256 必須匹配。
PlaybackEnabled = false

# .orp 絕對路徑。
ReplayPath =

# 空白存於 BepInEx/GEKIDRIVE/replays。
Directory =

# 單局事件上限，超過即停止錄製並告警。
MaxEvents = 1000000

# 練習／重放時自由鏡頭；WASD/QE 移動，右鍵拖曳旋轉。
FreeCamera = false

# 自由鏡頭移動速度。
CameraMoveSpeed = 5

# 空白使用原生 NotesManager 鏡頭；亦可指定場景 Camera 名稱。
CameraName =

# 練習／重放時隱藏 BattleUI；不隱藏譜面。
HideBattleHud = false


[Export]
# 練習／重放輸出無 BattleUI 的 PNG 序列，搭配 encode-video.ps1 產生 MP4（需 FFmpeg）。
Enabled = false

# 輸出寬度。
Width = 1920

# 輸出高度。
Height = 1080

# 離線影格步長；重放／練習時鐘每輸出一張才前進。
Fps = 60

# 空白存於 BepInEx/GEKIDRIVE/exports。
Directory =


[GP]
KeyboardConfirm = true
ConfirmKey = Return
# 固定私人機台的 GP 數值。
LockValue = false

# GP 固定值。
LockedValue = 900


[Cabinet]
# 私人機台遊戲費用免費模式；不向 AMDaemon 扣 credit。
FreePlay = false

# 本機虛擬 CREDIT 計數器；與原生 AMDaemon credit 分開。
VirtualCredits = false

# 虛擬計數器初值（啟動時）。
InitialCredits = 3

# 虛擬投幣鍵或原生投幣通知每次增加的 CREDIT。
CreditsPerPulse = 1

# 接受本機已驗證支付端 POST /credit 信號；需 OBS.Enabled 與非空 token。本模組不驗證 LINE Pay 訂單。
PaymentSignalBridge = false

# POST Bearer token；請自行設定至少 24 字元，空白／過短拒絕接收信號。
PaymentSignalToken =


[LED]
# 原生燈色轉發為 GD1 二進位序列協定，詳見 docs/led-protocol.md。
SerialEnabled = false

# Arduino / Teensy 序列埠。
Port = COM3

# 序列埠速率。
BaudRate = 115200


[Video]
# Native / Windowed / Borderless。
WindowMode = Native

# 視窗／主顯示寬度。
Width = 1920

# 視窗／主顯示高度。
Height = 1080

# 將原生 portrait 相機輸出重組為中間譜面、兩側原生 UI 裁切區與即時資料；區域可在 config 校正。
LandscapeLayout = false

# 來源 UV x,y,w,h（左下原點），中央譜面裁切。
TrackCrop = 0,0,1,0.72

# 左側角色／資料裁切。
LeftPanelCrop = 0,0.72,0.5,0.28

# 右側資料／按鍵提示裁切。
RightPanelCrop = 0.5,0.72,0.5,0.28

# 將指定來源區域獨立呈現於另一顯示器。
SecondDisplay = false

# Unity Display 索引（主顯示為 0）。
SecondDisplayIndex = 1

# 第二顯示器來源 UV 區域（Boss／卡牌）。
SecondDisplayCrop = 0,0.72,1,0.28


[Display]
ShowFps = true
EnableFrameControl = false
TargetFps = 60
ToggleKey = F7

[AutoPlay]
Enabled = false
ToggleKey = F8
CollectBells = true
AvoidBullets = true
TheoreticalJudgments = true
FollowTrack = true
MaxOverDamage = true

[Performance]
CacheChartAnalysis = true
DisableXmlSerializerCompilation = true

[MusicSelect]
PauseTimer = false
