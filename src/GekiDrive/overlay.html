<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEKIDRIVE OBS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:#f6f8fd;font:20px system-ui,sans-serif}.card{margin:24px;padding:26px 30px;width:min(720px,calc(100vw - 48px));border:1px solid #ffffff25;border-radius:20px;background:#101624e8;box-shadow:0 12px 40px #0005}.top{display:flex;justify-content:space-between;color:#95a5bc;font-size:13px;letter-spacing:2px}.live{color:#ffbb64}h1{font-size:30px;line-height:1.2;margin:20px 0 8px;overflow-wrap:anywhere}.level{color:#88d8ff;font-size:15px}.scores{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:24px}.label{font-size:12px;letter-spacing:2px;color:#95a5bc}.value{font-size:48px;font-variant-numeric:tabular-nums;font-weight:700}.combo{color:#72f2d0}.judgments{display:flex;justify-content:space-between;border-top:1px solid #ffffff18;padding-top:20px;margin-top:20px;font-size:13px}.judgments b{display:block;margin-top:6px;font-size:22px;font-variant-numeric:tabular-nums}.foot{margin-top:18px;color:#aab7cc;font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:8px}
</style>
<div class="card"><div class="top"><span>GEKIDRIVE</span><span id="connection" class="live"><i class="dot"></i>CONNECTING</span></div><h1 id="title">等待歌曲</h1><div id="difficulty" class="level">—</div><div class="scores"><div><div class="label">TECHNICAL SCORE</div><div id="score" class="value">0</div></div><div><div class="label">COMBO</div><div id="combo" class="value combo">0</div></div></div><div class="judgments"><span>CRITICAL<b id="critical">0</b></span><span>BREAK<b id="break">0</b></span><span>HIT<b id="hit">0</b></span><span>MISS<b id="miss">0</b></span></div><div class="foot" id="foot">—</div></div>
<script>
const el=id=>document.getElementById(id);let socket;
function connect(){socket=new WebSocket(`ws://${location.host}/ws`);socket.onopen=()=>{el('connection').textContent='CONNECTED';el('connection').style.color='#72f2d0'};socket.onmessage=e=>{try{const d=JSON.parse(e.data);el('title').textContent=d.title||'等待歌曲';el('difficulty').textContent=d.difficulty||'—';el('score').textContent=(d.technicalScore||0).toLocaleString();for(const k of ['combo','critical','break','hit','miss'])el(k).textContent=d[k]||0;el('foot').textContent=`${d.replay?'REPLAY · ':d.practice?'PRACTICE · ':''}${d.playing?'PLAYING':'IDLE'} · ${Number(d.timingMs||0).toFixed(1)} ms`}catch{}};socket.onclose=()=>{el('connection').textContent='DISCONNECTED';el('connection').style.color='#ffbb64';setTimeout(connect,2000)};socket.onerror=()=>socket.close()}
connect();
</script></html>
